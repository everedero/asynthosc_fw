CONFIG_STDOUT_CONSOLE=y
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_DISPLAY=y

CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_CFB_LOG_LEVEL_INF=y
CONFIG_CHARACTER_FRAMEBUFFER=y

#CONFIG_DISPLAY_LOG_LEVEL_DBG=y

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Persistent settings storage for menu-configured network parameters
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y
CONFIG_SETTINGS_FCB=y
CONFIG_SETTINGS_NVS=n
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# TinyOSC library
CONFIG_TINYOSC=y

# Temporarily disable shell to isolate application boot.
# CONFIG_SHELL is not set

# Networking - Reactivated with PHY fix
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_MDIO=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_POSIX_API=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_ETH_STM32_HAL_RX_THREAD_STACK_SIZE=4096
CONFIG_ETH_STM32_HAL_RX_THREAD_PREEMPTIVE=n
CONFIG_ETH_STM32_HW_CHECKSUM=n
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=80
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_IF_MAX_IPV4_COUNT=3
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.42"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.142"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
# Keep shell off while the app-side network reintegration is stabilized.
# CONFIG_NET_SHELL is not set
CONFIG_NET_CONFIG_AUTO_INIT=y

# Enable ETH driver debugging (comment out for production)
# CONFIG_ETHERNET_LOG_LEVEL_DBG=y
